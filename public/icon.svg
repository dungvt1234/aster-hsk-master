<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58CC02"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#15803d" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Tile -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Inner White Card Border -->
  <rect x="44" y="44" width="424" height="424" rx="92" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="8"/>
  
  <!-- Inner Tile Canvas -->
  <rect x="80" y="80" width="352" height="352" rx="64" fill="#ffffff"/>
  
  <!-- Chinese Red Tile Badge "中" -->
  <text x="256" y="320" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-size="240" font-weight="900" fill="#dc2626" text-anchor="middle">中</text>
  
  <!-- Golden Star on Top Right -->
  <path d="M370 120 L378 144 L404 144 L383 159 L391 183 L370 168 L349 183 L357 159 L336 144 L362 144 Z" fill="#f59e0b"/>
</svg>
